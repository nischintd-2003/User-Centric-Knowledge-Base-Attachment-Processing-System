events {}

http {
  upstream node_app {
    server app:8000;
  }

  server {
    listen 80;

    client_max_body_size 20M;

    location / {
      proxy_pass http://node_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
