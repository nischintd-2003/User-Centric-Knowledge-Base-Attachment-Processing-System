services:
  app:
    build: .
    container_name: user-acceptance-api
    env_file:
      - .env
    ports:
      - '8000:8000'
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: user-acceptance-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  uploads:
